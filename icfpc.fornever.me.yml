- name: Remove icfpc.fornever.me reverse proxy for icfpcontest2026.com
  hosts: fornever_me
  become: true # to modify /etc/nginx/conf.d

  tasks:
    - name: Ensure Nginx does not have a config for icfpc.fornever.me
      ansible.builtin.file:
        path: /etc/nginx/conf.d/icfpc.fornever.me.conf
        state: absent
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
