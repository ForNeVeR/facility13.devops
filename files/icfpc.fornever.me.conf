# Map to support proxying of WebSocket connections.
map $http_upgrade $icfpc_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=icfpcforneverme:10m rate=50r/s;

# icfpc.fornever.me: a full reverse proxy for icfpcontest2026.com.
server {
    listen 80;
    listen [::]:80;

    server_name icfpc.fornever.me;

    limit_req zone=icfpcforneverme burst=100 nodelay;

    # Cloudflare-fronted upstream, resolved to the IPv4 provided in the task.
    location / {
        proxy_http_version 1.1;

        # Pretend to be icfpcontest2026.com both in the HTTP Host header and in
        # the TLS SNI so that the upstream (Cloudflare) serves the right site.
        proxy_set_header Host icfpcontest2026.com;
        proxy_ssl_server_name on;
        proxy_ssl_name icfpcontest2026.com;
        proxy_ssl_verify off;

        # Forward the original request metadata.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $icfpc_connection_upgrade;

        # Do not rewrite Location/Refresh headers coming from the upstream:
        # keep the proxy fully transparent.
        proxy_redirect off;

        proxy_pass https://104.21.87.236:443;
    }
}
