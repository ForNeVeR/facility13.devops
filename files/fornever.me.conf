limit_req_zone $binary_remote_addr zone=forneverme:10m rate=50r/s;

server {
    server_name fornever.me;

    limit_req zone=forneverme burst=100 nodelay;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://[::1]:5001;
    }

    location /emulsion/ct/ {
    	rewrite /emulsion/ct/(.*) /$1 break;
    	proxy_redirect off;
		proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_http_version 1.1;
	    proxy_pass http://[::1]:5051;
    }

    location /emulsion/ct-icfpc/ {
    	rewrite /emulsion/ct-icfpc/(.*) /$1 break;
    	proxy_redirect off;
		proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_http_version 1.1;
	    proxy_pass http://[::1]:5052;
	    auth_basic "codingteam-icfpc";
	    auth_basic_user_file /etc/nginx/.httpasswd.codingteam-icfpc;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fornever.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fornever.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = fornever.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name fornever.me;
    listen 80;
    return 404; # managed by Certbot
}
