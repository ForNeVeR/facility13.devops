- name: Deploy fornever.me website
  hosts: fornever_me
  vars:
    fornever_me_version: v5.6.0
  become: true # to write to /etc/nginx/conf.d

  tasks:
    - name: Install fornever.me
      community.docker.docker_container:
        name: fornevermind
        image_name_mismatch: recreate
        image: revenrof/fornever.me:{{ fornever_me_version }}
        published_ports:
          - 5001:8080
        restart_policy: unless-stopped
        default_host_ip: ''
      notify: Prune Docker

    - name: Ensure Nginx has a config for fornever.me
      ansible.builtin.copy:
        src: fornever.me.conf
        dest: /etc/nginx/conf.d/fornever.me.conf
        mode: "u=rwx,go=rx"
      notify: Reload nginx

  handlers:
    - name: Prune Docker
      community.docker.docker_prune:
        containers: true
        images: true
        images_filters:
          dangling: false
        networks: true
        volumes: true
        builder_cache: true

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
